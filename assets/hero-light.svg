<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">cheathero — AI is the velocity; creativity is the vector.</title>
<desc id="d">cheathero's profile banner: AI is the velocity, creativity is the vector.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif}
.m{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.w1{animation:slide 7s linear infinite}
.w2{animation:slide 11s linear infinite reverse}
.w3{animation:slide 5s linear infinite}
@keyframes slide{to{transform:translateX(-240px)}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.dot{animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#d0d7de"/></pattern>
</defs>
