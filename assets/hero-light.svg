<text class="rise" x="64" y="192" font-size="23" fill="#59636e" style="animation-delay:.25s">AI is the <tspan font-weight="700" fill="#1f2328">velocity</tspan>. Creativity is the <tspan font-weight="700" fill="#1f2328">vector</tspan>.</text>
<text class="rise" x="64" y="218" font-size="15" fill="#818b98" style="animation-delay:.35s">AI 即生产力，创造力即一切</text>
