<text class="m rise" xml:space="preserve" x="752" y="122" font-size="17" style="animation-delay:0.50s"><tspan fill="#db2777">const </tspan><tspan fill="#1f2328">cheathero</tspan><tspan fill="#818b98"> = {</tspan></text><text class="m rise" xml:space="preserve" x="774" y="151" font-size="17" style="animation-delay:0.68s"><tspan fill="#0d9488">lever</tspan><tspan fill="#818b98">: </tspan><tspan fill="#6d4aff">"AI"</tspan><tspan fill="#818b98">,</tspan></text><text class="m rise" xml:space="preserve" x="774" y="180" font-size="17" style="animation-delay:0.86s"><tspan fill="#0d9488">vector</tspan><tspan fill="#818b98">: </tspan><tspan fill="#6d4aff">"creativity"</tspan><tspan fill="#818b98">,</tspan></text><text class="m rise" xml:space="preserve" x="774" y="209" font-size="17" style="animation-delay:1.04s"><tspan fill="#0d9488">ships</tspan><tspan fill="#818b98">: </tspan><tspan fill="#6d4aff">["boardcast", "rea"]</tspan><tspan fill="#818b98">,</tspan></text><text class="m rise" xml:space="preserve" x="774" y="238" font-size="17" style="animation-delay:1.22s"><tspan fill="#0d9488">shipping</tspan><tspan fill="#818b98">: </tspan><tspan fill="#db2777">true</tspan><tspan fill="#818b98">,</tspan></text><text class="m rise" xml:space="preserve" x="752" y="267" font-size="17" style="animation-delay:1.40s"><tspan fill="#818b98">};</tspan></text>
<rect class="cur" x="774" y="252" width="9" height="19" fill="#6d4aff" transform="translate(0 0)"/></g>
