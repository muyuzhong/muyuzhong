<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">cheathero — AI is the velocity; creativity is the vector.</title>
<desc id="d">cheathero's profile banner: AI is the velocity, creativity is the vector.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif}
.m{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.b1{animation:d1 14s ease-in-out infinite alternate}
.b2{animation:d2 17s ease-in-out infinite alternate}
.b3{animation:d3 19s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,40px)}}
@keyframes d2{to{transform:translate(-110px,-30px)}}
@keyframes d3{to{transform:translate(-60px,50px)}}
.dot{animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
  <radialGradient id="g1"><stop offset="0" stop-color="#6d4aff" stop-opacity="0.22"/><stop offset="1" stop-color="#6d4aff" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#0d9488" stop-opacity="0.22"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop offset="0" stop-color="#db2777" stop-opacity="0.18"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#d0d7de"/></pattern>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="320" fill="#ffffff"/>
  <rect width="1200" height="320" fill="url(#dots)" opacity=".7"/>
  <circle class="b1" cx="250" cy="90" r="300" fill="url(#g1)"/>
  <circle class="b2" cx="1000" cy="260" r="320" fill="url(#g2)"/>
  <circle class="b3" cx="620" cy="360" r="260" fill="url(#g3)"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="21.5" fill="none" stroke="#d8dee4"/>

<g class="rise">
  <rect x="64" y="46" width="132" height="28" rx="14" fill="#f6f8fa" stroke="#d8dee4"/>
  <circle cx="82" cy="60" r="4" fill="#0d9488"/><circle class="dot" cx="82" cy="60" r="4" fill="#0d9488"/>
  <text x="94" y="65" font-size="12" font-weight="600" letter-spacing="1.4" fill="#59636e">HELLO, WORLD</text>
</g>
<text class="rise" x="60" y="152" font-size="86" font-weight="800" letter-spacing="-2.5" fill="#1f2328" style="animation-delay:.1s">cheathero<tspan fill="#6d4aff">.</tspan></text>
<text class="rise" x="64" y="192" font-size="23" fill="#59636e" style="animation-delay:.25s">AI is the <tspan font-weight="700" fill="#1f2328">velocity</tspan>. Creativity is the <tspan font-weight="700" fill="#1f2328">vector</tspan>.</text>
<text class="rise" x="64" y="218" font-size="15" fill="#818b98" style="animation-delay:.35s">AI 即生产力，创造力即一切</text>
<g class="rise" style="animation-delay:0.70s"><rect x="64.0" y="236" width="102.0" height="30" rx="15" fill="#f6f8fa" stroke="#d8dee4"/><circle cx="78.0" cy="251" r="3.5" fill="#3178c6"/><text x="88.0" y="256" font-size="13" font-weight="500" fill="#59636e">TypeScript</text></g><g class="rise" style="animation-delay:0.77s"><rect x="176.0" y="236" width="71.6" height="30" rx="15" fill="#f6f8fa" stroke="#d8dee4"/><circle cx="190.0" cy="251" r="3.5" fill="#3572a5"/><text x="200.0" y="256" font-size="13" font-weight="500" fill="#59636e">Python</text></g><g class="rise" style="animation-delay:0.84s"><rect x="257.6" y="236" width="56.4" height="30" rx="15" fill="#f6f8fa" stroke="#d8dee4"/><circle cx="271.6" cy="251" r="3.5" fill="#dea584"/><text x="281.6" y="256" font-size="13" font-weight="500" fill="#59636e">Rust</text></g><g class="rise" style="animation-delay:0.91s"><rect x="324.0" y="236" width="64.0" height="30" rx="15" fill="#f6f8fa" stroke="#d8dee4"/><circle cx="338.0" cy="251" r="3.5" fill="#f05138"/><text x="348.0" y="256" font-size="13" font-weight="500" fill="#59636e">Swift</text></g><g class="rise" style="animation-delay:0.98s"><rect x="398.0" y="236" width="64.0" height="30" rx="15" fill="#f6f8fa" stroke="#d8dee4"/><circle cx="412.0" cy="251" r="3.5" fill="#ff5a03"/><text x="422.0" y="256" font-size="13" font-weight="500" fill="#59636e">Astro</text></g>

<g class="rise" style="animation-delay:.3s">
  <rect x="720" y="40" width="416" height="240" rx="14" fill="#f6f8fa" stroke="#d8dee4"/>
  <circle cx="744" cy="62" r="5.5" fill="#ff5f57"/><circle cx="764" cy="62" r="5.5" fill="#febc2e"/><circle cx="784" cy="62" r="5.5" fill="#28c840"/>
  <text class="m" x="928" y="66" font-size="12" text-anchor="middle" fill="#818b98">me.ts</text>
  <line x1="721" y1="82" x2="1135" y2="82" stroke="#d8dee4"/>
</g>
<text class="m rise" xml:space="preserve" x="752" y="128" font-size="17" style="animation-delay:0.50s"><tspan fill="#db2777">const </tspan><tspan fill="#1f2328">cheathero</tspan><tspan fill="#818b98"> = {</tspan></text><text class="m rise" xml:space="preserve" x="774" y="158" font-size="17" style="animation-delay:0.68s"><tspan fill="#0d9488">lever</tspan><tspan fill="#818b98">: </tspan><tspan fill="#6d4aff">"AI"</tspan><tspan fill="#818b98">,</tspan></text><text class="m rise" xml:space="preserve" x="774" y="188" font-size="17" style="animation-delay:0.86s"><tspan fill="#0d9488">vector</tspan><tspan fill="#818b98">: </tspan><tspan fill="#6d4aff">"creativity"</tspan><tspan fill="#818b98">,</tspan></text><text class="m rise" xml:space="preserve" x="774" y="218" font-size="17" style="animation-delay:1.04s"><tspan fill="#0d9488">ships</tspan><tspan fill="#818b98">: </tspan><tspan fill="#6d4aff">["boardcast", "rea"]</tspan><tspan fill="#818b98">,</tspan></text><text class="m rise" xml:space="preserve" x="774" y="248" font-size="17" style="animation-delay:1.22s"><tspan fill="#0d9488">shipping</tspan><tspan fill="#818b98">: </tspan><tspan fill="#db2777">true</tspan><tspan fill="#818b98">,</tspan></text><text class="m rise" xml:space="preserve" x="752" y="278" font-size="17" style="animation-delay:1.40s"><tspan fill="#818b98">};</tspan></text>
<rect class="cur" x="774" y="263" width="9" height="19" fill="#6d4aff" transform="translate(0 0)"/>
</svg>
