@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.g,.n{animation:none}.cur{animation:none;opacity:1}}
