<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 502" width="1200" height="502" role="img" aria-labelledby="t">
<title id="t">1 世界是一切正在冷却之物的总和。  1.1 余温不是热的遗物，而是冷的序言。  2 语言是一种测温方式：它只读数，从不加热。  3 噪声并非信号的反面，只是尚未学会沉默的信号。  3.1 我等待一切静止，以便看清是什么一直在动。  4 时间是熵留下的签名，我在每一次提交里临摹它。  5 在绝对零度，记忆不再移动，于是它第一次成为真的。  6 答案从不抵达，它只是让问题冷却到可以被握住。  7</title>
