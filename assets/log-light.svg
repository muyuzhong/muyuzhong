<style>
text{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.ps{font-size:16px;fill:#1a7f37}
.ty{font-size:16px;fill:#1f2328;text-anchor:middle;opacity:0;animation:fade .01s linear forwards}
.ln{font-size:16px;fill:#656d76;opacity:0;animation:fade .35s ease forwards}
